name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node 22.19
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Use the canonical temporary directory
        run: |
          node -e "const fs=require('node:fs'); const os=require('node:os'); const canonical=fs.realpathSync(os.tmpdir()); fs.appendFileSync(process.env.GITHUB_ENV, ['TMPDIR='+canonical, 'TMP='+canonical, 'TEMP='+canonical, ''].join('\n'));"

      - name: Pin npm 11.13.0
        run: npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from lockfile
        id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check package boundaries, build, and types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check

      - name: Run test suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:ci

      - name: Test packed installation
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 15
        run: npm run test:packed-install
